# Blok nginx untuk CIRCLE.DOMAIN-ANDA.com — SUDAH DITERAPKAN di VPS (20 Okt 2026; certbot menambah blok 443 + redirect).
# Simpan sebagai /etc/nginx/sites-available/unit-operations-dashboard-bloom, symlink ke sites-enabled, lalu:
#   certbot --nginx -d CIRCLE.DOMAIN-ANDA.com      (setelah DNS CIRCLE.DOMAIN-ANDA.com → <IP-VPS> aktif)
#   nginx -t && systemctl reload nginx
# Tampilan web circle disajikan nginx dari /var/www/unit-operations-dashboard/dist; /api diteruskan ke server Ekosistem (port 3001)
# dengan header X-Unit-Web yang SELALU ditimpa nginx (klien tidak bisa memalsukan).
server {
    server_name CIRCLE.DOMAIN-ANDA.com;
    root /var/www/unit-operations-dashboard/dist;
    index index.html;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Unit-Web SLUG-CIRCLE;        # ← penentu etalase; harus sama dengan Circle.slug
    }
    # header keamanan: /etc/nginx/snippets/unit-operations-dashboard-headers.conf (X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy, HSTS 6 bulan)
    # — di-include di SETIAP location yang memakai add_header (add_header di location menimpa yang di server)
    location /assets/ { expires 7d; add_header Cache-Control "public"; include /etc/nginx/snippets/unit-operations-dashboard-headers.conf; try_files $uri =404; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/unit-operations-dashboard-headers.conf; }
    listen 80;
}
